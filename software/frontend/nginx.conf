# Derive the upstream host from the configured origin, never request headers.
map "${APP_URL}" $monitor_app_authority {
    default "";
    ~^https://(?<monitor_origin_authority>[^/]+)$ $monitor_origin_authority;
}

# Browser headers are an extra write boundary, never authentication.
map $http_origin $monitor_bad_origin {
    default 1;
    "" 0;
    "${APP_URL}" 0;
}
map $http_sec_fetch_site $monitor_foreign_site {
    default 0;
    same-site 1;
    cross-site 1;
}
# Block supported write methods when either browser-origin flag is set.
map "$request_method:$monitor_bad_origin:$monitor_foreign_site" $monitor_block_write {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):(1:0|0:1|1:1)$ 1;
}

server {
    listen 80;
    server_name _;
    access_log off;
    return 308 ${APP_URL}$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    server_name _;
    access_log off;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Keep the original /api path and API errors out of the SPA fallback.
    location ~ ^/api(?:/|$) {
        if ($monitor_block_write) { return 403; }
        set $monitor_backend backend:8000;
        proxy_pass http://$monitor_backend$request_uri;
        # Dedicated production hop: derive HTTPS identity from deployment config.
        proxy_set_header Host $monitor_app_authority;
        proxy_set_header X-Forwarded-Host $monitor_app_authority;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
