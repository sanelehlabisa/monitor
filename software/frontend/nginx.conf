# Browser headers are an extra write boundary, never authentication.
map $http_origin $monitor_bad_origin {
    default 1;
    "" 0;
    "https://${APP_DOMAIN}" 0;
}
map $http_sec_fetch_site $monitor_foreign_site {
    default 0;
    same-site 1;
    cross-site 1;
}
# Block supported write methods when either browser-origin flag is set.
map "$request_method:$monitor_bad_origin:$monitor_foreign_site" $monitor_block_write {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):(1:0|0:1|1:1)$ 1;
}

server {
    listen 80;
    server_name ${APP_DOMAIN};
    access_log off;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Keep the original /api path and API errors out of the SPA fallback.
    location ~ ^/api(?:/|$) {
        if ($monitor_block_write) { return 403; }
        set $monitor_backend backend:8000;
        proxy_pass http://$monitor_backend$request_uri;
        # Dedicated production hop: derive HTTPS identity from deployment config.
        proxy_set_header Host ${APP_DOMAIN};
        proxy_set_header X-Forwarded-Host ${APP_DOMAIN};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
