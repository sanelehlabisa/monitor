name: monitor-dev

services:
  database:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in software/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in software/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in software/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/000-schema.sql:ro
      - ./database/seeds/010-users.sql:/docker-entrypoint-initdb.d/010-users.sql:ro
      - ./database/seeds/020-demo-meters.sql:/docker-entrypoint-initdb.d/020-demo-meters.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    stop_grace_period: 120s
    build:
      context: ./backend
      target: development
    environment:
      MONITOR_ENVIRONMENT: development
      MONITOR_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      MONITOR_CORS_ORIGIN: http://localhost:5173
      MONITOR_OTP_HMAC_SECRET: ${MONITOR_OTP_HMAC_SECRET:?Set MONITOR_OTP_HMAC_SECRET in software/.env}
      MONITOR_MONTHLY_REMINDERS_ACTIVATED_AT: ${MONITOR_MONTHLY_REMINDERS_ACTIVATED_AT:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      EMAIL_FROM: no-reply@monitor.local
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  frontend-node-modules:
