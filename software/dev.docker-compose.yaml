name: monitor-dev

services:
  database:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in software/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in software/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in software/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in software/.env}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    stop_grace_period: 120s
    build:
      context: ./backend
      target: development
    environment:
      MONITOR_ENVIRONMENT: ${MONITOR_ENVIRONMENT:?Set MONITOR_ENVIRONMENT in software/.env}
      MONITOR_LOG_LEVEL: ${MONITOR_LOG_LEVEL:?Set MONITOR_LOG_LEVEL in software/.env}
      MONITOR_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      MONITOR_CORS_ORIGIN: http://localhost:${FRONTEND_PORT}
      MONITOR_OTP_HMAC_SECRET: ${MONITOR_OTP_HMAC_SECRET:?Set MONITOR_OTP_HMAC_SECRET in software/.env}
      MONITOR_MONTHLY_REMINDERS_ACTIVATED_AT: ${MONITOR_MONTHLY_REMINDERS_ACTIVATED_AT:-}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in software/.env}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT in software/.env}
      SMTP_SECURE: ${SMTP_SECURE:?Set SMTP_SECURE in software/.env}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in software/.env}
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:?Set BACKEND_PORT in software/.env}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:?Set FRONTEND_PORT in software/.env}:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  frontend-node-modules:
