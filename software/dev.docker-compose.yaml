name: monitor-dev

services:
  database:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitor}
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    command: >-
      sh -c "python -m app.migrations &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      MONITOR_ENVIRONMENT: ${MONITOR_ENVIRONMENT:-development}
      MONITOR_LOG_LEVEL: ${MONITOR_LOG_LEVEL:-INFO}
      MONITOR_DATABASE_URL: postgresql://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:-monitor_dev_only}@database:5432/${POSTGRES_DB:-monitor}
      MONITOR_CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      MONITOR_OTP_HMAC_SECRET: ${MONITOR_OTP_HMAC_SECRET:-monitor_dev_otp_secret_change_me}
    volumes:
      - ./backend:/app
      - ./database/migrations:/migrations:ro
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  frontend-node-modules:
